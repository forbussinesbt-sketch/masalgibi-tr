<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Geçişlerde beyaz flash olmasın diye koyu fallback -->
  <style>html{background:#1a1614}</style>

  <title>Portfolio — Bekir Taş</title>
  <meta name="description" content="Bekir Taş — Gayrimenkul danışmanı. Portföy, referanslar ve iletişim.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portfolio — Bekir Taş">
  <meta property="og:description" content="Bekir Taş — Gayrimenkul danışmanı.">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonts — render-blocking olmasın diye preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/nav.css">
</head>
<body class="page-index">
  <a href="#mainContent" class="skip-to-content">Ana içeriğe geç</a>

  <!-- ========== GİRİŞ EKRANI (TV PRELOADER) ========== -->
  <div class="preloader" id="preloader" role="presentation" aria-hidden="true">
    <div class="tv-outer" id="tvOuter">
      <div class="tv-screen">

        <!-- İç katman — glitch sarsıntısı SADECE buna uygulanır -->
        <div class="tv-inner" id="tvInner">
          <!-- SMPTE renk barları (üst %75) -->
          <div class="tv-bars">
            <div class="tv-bar tv-bar--w"></div>
            <div class="tv-bar tv-bar--y"></div>
            <div class="tv-bar tv-bar--c"></div>
            <div class="tv-bar tv-bar--g"></div>
            <div class="tv-bar tv-bar--m"></div>
            <div class="tv-bar tv-bar--r"></div>
            <div class="tv-bar tv-bar--b"></div>
          </div>
          <!-- Alt şerit (%25) -->
          <div class="tv-bars-bottom">
            <div class="tv-bar-b tv-bar-b--1"></div>
            <div class="tv-bar-b tv-bar-b--2"></div>
            <div class="tv-bar-b tv-bar-b--3"></div>
            <div class="tv-bar-b tv-bar-b--4"></div>
            <div class="tv-bar-b tv-bar-b--5"></div>
            <div class="tv-bar-b tv-bar-b--6"></div>
            <div class="tv-bar-b tv-bar-b--7"></div>
          </div>
          <!-- Barkod desenleri -->
          <div class="tv-barcode tv-barcode--left"></div>
          <div class="tv-barcode tv-barcode--right"></div>
          <!-- Kaos blokları: 30 blok + 3 artı (konumlar CSS'te) -->
          <div class="tv-chaos" id="tvChaos"></div>
          <!-- Merkez panel -->
          <div class="tv-center">
            <div class="tv-panel">
              <div class="tv-msg" id="tvMsg"></div>
              <div class="tv-panel-bar">
                <div class="tv-progress">
                  <div class="tv-progress-fill" id="tvProgressFill"></div>
                </div>
              </div>
              <div class="tv-skip-hint" id="tvSkipHint">
                <span class="tv-skip-desktop">GEÇMEK İÇİN SPACE VEYA ESC</span>
                <span class="tv-skip-mobile">GEÇMEK İÇİN DOKUN</span>
              </div>
            </div>
          </div>
        </div><!-- /tv-inner -->

        <!-- BIOS terminali — %100 sonrası açılır -->
        <div class="tv-bios" id="tvBios"></div>

        <!-- Sabit overlay'ler — glitch ile hareket etmez -->
        <div class="tv-scanlines"></div>
        <canvas class="tv-grain-canvas" id="tvGrainCanvas"></canvas>
        <canvas class="tv-glitch-canvas" id="tvGlitchCanvas"></canvas>
        <div class="tv-scanner-lines">
          <span style="--dur:9s;--del:0s"></span>
          <span style="--dur:13s;--del:-5s"></span>
          <span style="--dur:17s;--del:-10s"></span>
        </div>
        <div class="tv-inner-glow"></div>
        <div class="tv-vignette"></div>
      </div>
    </div>
  </div>

  <!-- ========== ARKA PLAN KATMANLARI ========== -->
  <div class="bg-layer" aria-hidden="true">
    <canvas class="bg-canvas"    id="bgCanvas"></canvas>
    <canvas class="fluid-canvas" id="fluidCanvas"></canvas>
    <div class="bg-noise"></div>
  </div>

  <!-- ========== YAN ETİKETLER (içerik config.js'ten) ========== -->
  <nav aria-label="Sayfa navigasyonu">
    <a href="#" class="side side--left" id="sideLeft">
      <span class="side-text"><span class="side-arrow">←</span> <span data-side-text></span></span>
      <span class="side-nr" data-side-nr></span>
    </a>
    <a href="#" class="side side--right" id="sideRight">
      <span class="side-nr" data-side-nr></span>
      <span class="side-text"><span data-side-text></span> <span class="side-arrow">→</span></span>
    </a>
  </nav>

  <!-- ========== PORTRE + İSİM (birlikte kayar) ========== -->
  <main id="mainContent">
    <h1 class="sr-only">Bekir Taş — Gayrimenkul Danışmanı &amp; Portfolyo</h1>

    <div class="slide-group" id="slideGroup" aria-hidden="true">
      <div class="portrait-section" id="portraitSection">
        <div class="portrait-frame" id="portraitFrame">
          <img class="portrait-base" id="portraitBase"
               src="assets/images/portre.webp"
               alt="Bekir Taş, gayrimenkul danışmanı"
               width="1069" height="1625"
               draggable="false" fetchpriority="high">
          <!-- Akışkanla maskelenen çizim versiyonu buraya çizilir -->
          <canvas class="illustration-canvas" id="illustrationCanvas"></canvas>
        </div>
      </div>

      <div class="name-section" id="nameSection">
        <div class="name-display" id="nameDisplay"><!-- slotlar JS ile --></div>
      </div>
    </div>
  </main>

  <!-- ========== ÖZEL İMLEÇ ========== -->
  <div class="cursor" id="cursor" aria-hidden="true">
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="cursor-dot"  id="cursorDot"></div>
  </div>

  <!-- ========== KALICI CRT KATMANI ========== -->
  <div class="page-tv-overlay" aria-hidden="true">
    <div class="page-scanlines"></div>
    <canvas class="page-grain-canvas" id="pageGrainCanvas"></canvas>
    <div class="page-scanner-lines">
      <span style="--dur:10s;--op:0.10"></span>
      <span style="--dur:13s;--op:0.07"></span>
      <span style="--dur:17s;--op:0.04"></span>
    </div>
    <div class="page-inner-glow"></div>
    <div class="page-vignette"></div>
  </div>

  <!-- CRT cam pahı / siyah çerçeve / ince iç kontur -->
  <div class="page-crt-bevel" aria-hidden="true"></div>
  <div class="page-tv-frame" aria-hidden="true"></div>
  <svg class="page-tv-stroke" aria-hidden="true"></svg>

  <!-- Senkron barrel clip-path: JS dosyaları yüklenene kadar çerçeve kaybolmasın.
       tv-overlay.js aynı hesabı yapıp resize'da günceller. -->
  <script>
  (function () {
    var W = window.innerWidth, H = window.innerHeight, m = W <= 768;
    var MC = m ? 12 : 38, MM = m ? 4 : 8;
    var R = m ? Math.min(Math.max(18, W * 0.030), 28)
              : Math.min(Math.max(40, W * 0.042), 70);
    var inner = 'M ' + (MC + R) + ',' + MC +
      ' Q ' + (W / 2) + ',' + MM + ' ' + (W - MC - R) + ',' + MC +
      ' Q ' + (W - MC) + ',' + MC + ' ' + (W - MC) + ',' + (MC + R) +
      ' Q ' + (W - MM) + ',' + (H / 2) + ' ' + (W - MC) + ',' + (H - MC - R) +
      ' Q ' + (W - MC) + ',' + (H - MC) + ' ' + (W - MC - R) + ',' + (H - MC) +
      ' Q ' + (W / 2) + ',' + (H - MM) + ' ' + (MC + R) + ',' + (H - MC) +
      ' Q ' + MC + ',' + (H - MC) + ' ' + MC + ',' + (H - MC - R) +
      ' Q ' + MM + ',' + (H / 2) + ' ' + MC + ',' + (MC + R) +
      ' Q ' + MC + ',' + MC + ' ' + (MC + R) + ',' + MC + ' Z';
    var outer = 'M 0,0 L ' + W + ',0 L ' + W + ',' + H + ' L 0,' + H + ' Z';

    var f = document.querySelector('.page-tv-frame');
    var b = document.querySelector('.page-crt-bevel');
    var sv = document.querySelector('.page-tv-stroke');
    if (f) { f.style.clipPath = "path(evenodd, '" + outer + ' ' + inner + "')"; f.style.visibility = 'visible'; }
    if (b) { b.style.clipPath = "path('" + inner + "')"; }
    if (sv) {
      sv.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      sv.style.clipPath = "path('" + inner + "')";
      var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', inner);
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', 'rgba(30,28,26,0.10)');
      p.setAttribute('stroke-width', '6');
      sv.appendChild(p);
    }
  })();
  </script>

  <!-- Küçük ekranlarda akışkan simülasyonunu hafiflet -->
  <script>
  (function () {
    var w = window.innerWidth;
    if (w < 1200) {
      window.FluidSimOverride = {
        CURL:                w < 600 ? 8    : w < 900 ? 12   : 16,
        SPLAT_RADIUS:        w < 600 ? 0.18 : w < 900 ? 0.20 : 0.22,
        SIM_RESOLUTION:      w < 600 ? 64   : w < 900 ? 96   : 128,
        PRESSURE_ITERATIONS: w < 600 ? 8    : w < 900 ? 12   : 16
      };
    }
  })();
  </script>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/fluid.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/nav.js" defer></script>
  <script src="assets/js/tv-overlay.js" defer></script>
</body>
</html>
