<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#efece5">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://masal.masal-sunucu.workers.dev; base-uri 'none'; form-action 'none'">
<title>Masal Gibi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b2644'/%3E%3Cpath d='M20 6a10 10 0 1 0 6 14A8 8 0 0 1 20 6z' fill='%23e3c27a'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="simge-180.png">
<meta name="apple-mobile-web-app-title" content="Masal Gibi">
<link rel="stylesheet" href="stil.css?v=12">
</head>
<body>
<main id="kitap" class="ekran">
  <div class="masa">
    <button id="on-kapak" class="on-kapak" type="button" aria-label="Kitabı aç ve masala başla">
      <span class="kapak-ic"><span class="kapak-ust"><svg class="ay" viewBox="0 0 48 48" aria-hidden="true"><path d="M31 8a17 17 0 1 0 9 24A14 14 0 0 1 31 8z"/><path d="M39 10v6M36 13h6M42 22v4M40 24h4"/></svg><span class="ad">Masal Gibi</span></span><span class="sayac"><span>Bekir, Seda'yı</span><strong class="sayi">…</strong><span>kez hatırladı</span></span></span>
      <span id="serit" class="serit" hidden></span>
    </button>
    <div id="kayan" class="kayan" hidden></div>
  </div>
  <div class="alt">
    <div id="kapak-alt" class="kapak-alt"><button id="masal-yaz" class="dugme dolu" type="button">Masal Yaz</button><span id="ipucu" class="ipucu" role="status"></span></div>
    <nav id="cubuk" class="cubuk" aria-label="Kitap" hidden>
      <span class="ilerle" aria-hidden="true"><b id="ilerle"></b></span>
      <button id="icindekiler-ac" class="yalin" type="button">İçindekiler</button>
      <span class="oklar"><button id="geri" class="ok" type="button" aria-label="Önceki sayfa">‹</button><span id="sayfa-no"></span><button id="ileri" class="ok" type="button" aria-label="Sonraki sayfa">›</button></span>
      <button class="yalin" data-git="mektuplar" type="button">Mektuplar</button>
    </nav>
  </div>
</main>
<div id="olcum" aria-hidden="true"></div>

<main id="mektuplar" class="ekran dar" hidden>
  <header class="ust"><button class="yalin" data-git="" type="button">Kapak</button><button class="yalin" data-git="kitap" type="button">Kitapta oku</button><button id="cikis" class="yalin" type="button">Çıkış</button></header>
  <h1>Mektuplar</h1>
  <div class="suz" role="group" aria-label="Süz">
    <button type="button" data-suz="" aria-pressed="true">Hepsi</button><button type="button" data-suz="bekir" aria-pressed="false">Bekir</button><button type="button" data-suz="seda" aria-pressed="false">Seda</button>
    <button type="button" id="sira" class="sira">En yeni önce</button>
  </div>
  <div id="liste" class="liste"></div>
  <div class="alt-yaz"><button id="yaz" class="dugme dolu" type="button">Mektup yaz</button></div>
</main>

<dialog id="icindekiler" class="pencere icin" aria-labelledby="icin-b">
  <button class="kapat" type="button" data-kapat aria-label="Kapat">×</button>
  <h2 id="icin-b">İçindekiler</h2>
  <div class="boy" role="group" aria-label="Yazı boyutu"><button id="yazi-az" type="button" aria-label="Yazıyı küçült">A−</button><span class="ornek">Bir varmış, bir yokmuş</span><button id="yazi-cok" type="button" aria-label="Yazıyı büyüt">A+</button></div>
  <div id="icindekiler-liste"></div>
</dialog>

<dialog id="giris" class="pencere" aria-labelledby="giris-b">
  <form method="dialog" novalidate>
    <button class="kapat" type="button" data-kapat aria-label="Kapat">×</button>
    <h2 id="giris-b">Kim geldi?</h2>
    <div class="kimler"><label><input type="radio" name="ad" value="bekir" required>Bekir</label><label><input type="radio" name="ad" value="seda">Seda</label></div>
    <label class="alan davet" hidden>Davet kodu<input name="davet" autocomplete="off" autocapitalize="characters" maxlength="20"></label>
    <label class="alan"><span id="parola-ad">Parola</span><input name="parola" type="password" autocomplete="current-password" maxlength="200"></label>
    <label class="alan davet" hidden>Parola tekrar<input name="parola2" type="password" autocomplete="new-password" maxlength="200"></label>
    <p class="hata" role="alert"></p>
    <button class="dugme dolu genis" type="submit">Kitabı aç</button>
    <button class="yalin genis" type="button" id="kur-ac">İlk kez geliyorum, davet kodum var</button>
  </form>
</dialog>

<dialog id="yazma" class="pencere tam" aria-labelledby="yazma-b">
  <form method="dialog" novalidate>
    <header class="ust"><button class="yalin" type="button" data-kapat>Vazgeç</button><h2 id="yazma-b">Yeni mektup</h2><button class="dugme dolu" type="submit">Kitaba ekle</button></header>
    <div class="kagit">
      <input name="baslik" class="k-baslik" maxlength="120" placeholder="Başlık, istersen" aria-label="Başlık" autocomplete="off" enterkeyhint="next">
      <textarea name="metin" class="k-metin" maxlength="20000" placeholder="Bir varmış..." aria-label="Mektubun" autofocus></textarea>
      <div id="secilen" class="secilen"></div>
      <p class="hata" role="alert"></p><p id="muhur-not" class="not"></p><p id="taslak" class="not" role="status"></p>
    </div>
    <button id="fikir" class="fikir" type="button" hidden></button>
    <div class="arac">
      <label class="cip">Fotoğraf<input id="foto" type="file" accept="image/*" multiple class="ort"></label>
      <label class="cip"><span id="tarih-ad">Bugün</span><input name="tarih" type="date" class="ort" aria-label="Tarih" required></label>
      <label class="cip" id="muhur-cip"><span id="muhur-ad">Mühürle</span><input name="muhur" type="date" class="ort" aria-label="Mühür tarihi"></label>
      <button id="fikir-ver" class="cip" type="button">Fikir ver</button>
    </div>
  </form>
</dialog>

<dialog id="buyut" class="buyut"><button class="kapat" type="button" data-kapat aria-label="Kapat">×</button><img alt=""></dialog>
<div id="baski" aria-hidden="true"></div>
<div id="bildirim" class="bildirim" role="status" hidden></div>

<script src="page-flip.js?v=12"></script>
<script src="ayar.js?v=12"></script>
<script type="module" src="uygulama.js?v=12"></script>
</body>
</html>
